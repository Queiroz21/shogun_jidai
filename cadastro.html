<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Shogun Jidai</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: url('assets/stars.png') repeat #000;
      background-size: cover;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .registro-container {
      background: rgba(10, 20, 50, 0.7);
      border: 2px solid rgba(74, 170, 255, 0.3);
      border-radius: 12px;
      padding: 40px;
      max-width: 450px;
      width: 100%;
      backdrop-filter: blur(10px);
    }

    h1 {
      text-align: center;
      color: #4af;
      margin-bottom: 30px;
      font-size: 28px;
      text-shadow: 0 0 10px rgba(74, 170, 255, 0.5);
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    label {
      color: #4af;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      padding: 12px;
      background: rgba(10, 20, 50, 0.5);
      border: 1px solid rgba(74, 170, 255, 0.3);
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #4af;
      box-shadow: 0 0 10px rgba(74, 170, 255, 0.3);
      background: rgba(10, 20, 50, 0.8);
    }

    input::placeholder {
      color: #888;
    }

    select option {
      background: #0a1432;
      color: #fff;
    }

    button {
      padding: 12px;
      background: linear-gradient(135deg, #4af, #0f8);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 20px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(74, 170, 255, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .link-section {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 14px;
    }

    .link-section a {
      color: #4af;
      text-decoration: none;
      transition: 0.3s;
      font-weight: bold;
    }

    .link-section a:hover {
      color: #0f8;
      text-decoration: underline;
    }

    .error-message {
      color: #f66;
      background: rgba(255, 100, 100, 0.1);
      border: 1px solid rgba(255, 100, 100, 0.3);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      color: #0f8;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.3);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }

    .success-message.show {
      display: block;
    }
  </style>
</head>
<body>

<div class="registro-container">
  <h1>⚔️ Criar Ficha</h1>
  
  <div id="error-message" class="error-message"></div>
  <div id="success-message" class="success-message"></div>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="seu@email.com">
  </div>

  <div class="form-group">
    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="Sua senha (min 6 caracteres)">
  </div>

  <div class="form-group">
    <label for="nick">Nome do Shinobi</label>
    <input type="text" id="nick" placeholder="Ex: Naruto Uzumaki">
  </div>

  <div class="form-group">
    <label for="idade">Idade</label>
    <input type="number" id="idade" placeholder="Ex: 16" min="1" max="120">
  </div>

  <div class="form-group">
    <label for="claSelect">Clã / Aldeia</label>
    <select id="claSelect">
      <option value="">Selecione um clã...</option>
    </select>
  </div>

  <div class="form-group">
    <label for="uidSecundario">UID da Ficha Principal (Ficha Secundária)</label>
    <input type="text" id="uidSecundario" placeholder="Deixe vazio para criar ficha principal">
    <small style="color: #888; display: block; margin-top: 4px;">Peça seu UID ao ADM se quer criar uma ficha secundária</small>
  </div>

  <button id="btnCriar">Criar Conta</button>

  <div class="link-section">
    Já tem uma conta? <a href="index.html">Fazer Login</a>
  </div>
</div>

<script type="module" src="oauth.js"></script>
<script type="module">
  import { loadClans } from "./oauth.js";
  loadClans();
</script>
</body>
</html>
