<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árvore de Invocações</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .invocacao-tree {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
            margin-top: 20px;
            width: 100%;
            padding: 10px 30px 20px;
        }

        .familia-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 160px;
        }

        .familia-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .familia-header:hover {
            transform: scale(1.05);
        }

        .familia-icon {
            width: 90px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #4af;
            transition: filter 0.2s, border-color 0.2s;
        }

        .familia-header:hover .familia-icon {
            filter: drop-shadow(0 0 8px #4af);
        }

        .familia-nome {
            color: #4af;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            max-width: 150px;
        }

        .familia-toggle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid #4af;
            background: rgba(0,0,0,0.7);
            color: #4af;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .familia-toggle:hover {
            background: #4af;
            color: #000;
        }

        .animais-grid {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-direction: column;
            min-width: max-content;
        }

        .animal-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .animal-card:hover {
            transform: scale(1.08);
        }

        .animal-icon {
            width: 70px;
            height: 70px;
            border-radius: 6px;
            object-fit: cover;
            border: 2px solid #4af;
            transition: filter 0.2s, border-color 0.2s;
        }

        .animal-card:hover .animal-icon {
            filter: drop-shadow(0 0 6px #4af);
        }

        .animal-icon.bloqueado {
            opacity: 0.5;
            filter: grayscale(70%);
            border-color: #f66;
        }

        .animal-card:hover .animal-icon.bloqueado {
            filter: grayscale(70%) drop-shadow(0 0 6px #f66);
        }

        .animal-nome {
            color: #eee;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 8px;
            max-width: 120px;
            min-height: 20px;
        }

        .region-tabs {
            display: flex;
            gap: 8px;
            margin: 16px 0;
            flex-wrap: wrap;
        }

        .region-btn {
            padding: 8px 16px;
            border: 2px solid #4af;
            background: rgba(74, 170, 255, 0.1);
            color: #4af;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .region-btn:hover {
            background: rgba(74, 170, 255, 0.2);
        }

        .region-btn.active {
            background: #4af;
            color: #000;
        }

        .tooltip {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 25, 0.98);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #4af;
            font-size: 12px;
            width: 200px;
            text-align: left;
            z-index: 999999999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
            white-space: pre-line;
            box-shadow: 0 0 10px #4af;
            display: none;
            line-height: 1.4;
        }

        .animal-card .tooltip {
            bottom: 100%;
            margin-bottom: 8px;
        }

        .animal-card:hover .tooltip {
            opacity: 1;
            display: block;
            pointer-events: auto;
        }

        .tooltip::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            margin-left: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: #4af transparent transparent transparent;
        }
    </style>
</head>

<body>
    <header id="top-header">
        <div id="header-left">
            <p><span id="playerOnlyXp">XP: -- / --</span> - <span id="playerOnlyPontos">Pontos: --</span></p>
        </div>
        <div id="header-center">
            <select id="selectFicha" style="margin-right: 15px; padding: 8px; background: #222; color: #fff; border: 2px solid #ff6b00; border-radius: 5px; font-weight: bold;"></select>
        </div>
        <div id="header-right">
            <button class="header-btn" id="btnPerfil">Perfil</button>
            <button class="header-btn" id="btnLoja">⚙️ Loja</button>
            <button class="header-btn" id="btnHabilidades">Árvore de Habilidades</button>
            <button class="header-btn" id="btnAdmin" style="display: none; background: #ff6b00;">Admin</button>
            <button class="header-btn" id="btnLogout">🚪 Sair</button>
        </div>
    </header>

    <h1>Árvore de Invocações</h1>

    <div class="region-tabs" id="region-tabs"></div>

    <div id="tree-viewport">
        <div id="org-chart" class="invocacao-tree"></div>
    </div>

    <div id="confirmModal" class="modal hidden">
        <div class="modal-box">
            <h3 id="modalTitle"></h3>
            <p id="modalText"></p>
            <div id="modalJutsus" style="margin:12px 0; max-height:120px; overflow-y:auto;"></div>
            <div class="modal-actions">
                <button id="btnConfirm">Confirmar</button>
                <button id="btnCancel">Cancelar</button>
            </div>
        </div>
    </div>

    <script type="module" src="invocacoes.js"></script>
</body>

</html>
