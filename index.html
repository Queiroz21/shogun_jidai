<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Shogun Jidai</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: url('assets/stars.png') repeat #000;
      background-size: cover;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background: rgba(10, 20, 50, 0.7);
      border: 2px solid rgba(74, 170, 255, 0.3);
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      backdrop-filter: blur(10px);
    }

    h1 {
      text-align: center;
      color: #4af;
      margin-bottom: 30px;
      font-size: 28px;
      text-shadow: 0 0 10px rgba(74, 170, 255, 0.5);
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    label {
      color: #4af;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      padding: 12px;
      background: rgba(10, 20, 50, 0.5);
      border: 1px solid rgba(74, 170, 255, 0.3);
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      transition: 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #4af;
      box-shadow: 0 0 10px rgba(74, 170, 255, 0.3);
      background: rgba(10, 20, 50, 0.8);
    }

    input::placeholder {
      color: #888;
    }

    button {
      padding: 12px;
      background: linear-gradient(135deg, #4af, #0f8);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 15px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(74, 170, 255, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    a {
      color: #4af;
      text-decoration: none;
      font-size: 14px;
      transition: 0.3s;
    }

    a:hover {
      color: #0f8;
      text-decoration: underline;
    }

    .error-message {
      color: #f66;
      background: rgba(255, 100, 100, 0.1);
      border: 1px solid rgba(255, 100, 100, 0.3);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }

    .error-message.show {
      display: block;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h1>🌙 Shogun Jidai</h1>
  
  <div id="error-message" class="error-message"></div>
  
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="seu@email.com">
  </div>

  <div class="form-group">
    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="Sua senha">
  </div>

  <button id="btnLogin">Entrar</button>

  <div class="links">
    <span style="color: #888; font-size: 12px;">Não tem conta?</span>
    <a href="cadastro.html">Criar Conta</a>
  </div>
</div>

<script type="module" src="oauth.js"></script>
</body>
</html>
